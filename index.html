<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Liquid Sort Puzzle</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%230a0a1a' width='100' height='100'/><circle cx='50' cy='50' r='40' fill='%23ff0080'/></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%230a0a1a' width='100' height='100'/><circle cx='50' cy='50' r='40' fill='%23ff0080'/></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 50%, #0a0a1a 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #fff;
        }

        h1 {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 0, 128, 0.5),
                         0 0 40px rgba(0, 255, 255, 0.3);
            background: linear-gradient(90deg, #ff0080, #00ffff, #ff0080);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: glow 3s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            padding: 20px;
            max-width: 100%;
        }

        .tubes-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: clamp(15px, 3vw, 30px);
            padding: 20px;
        }

        .tube {
            width: clamp(50px, 12vw, 80px);
            height: clamp(150px, 35vw, 250px);
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: none;
            border-radius: 0 0 25px 25px;
            position: relative;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
            backdrop-filter: blur(5px);
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 2px 10px rgba(255, 255, 255, 0.1);
        }

        .tube::before {
            content: '';
            position: absolute;
            top: 0;
            left: 10%;
            right: 10%;
            height: 60%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            border-radius: 50%;
            pointer-events: none;
        }

        .tube:hover {
            border-color: rgba(255, 255, 255, 0.7);
            box-shadow: 0 0 25px rgba(78, 197, 247, 0.4), 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 2px 10px rgba(255, 255, 255, 0.15);
            transform: translateY(-3px);
        }

        .tube.selected {
            transform: translateY(-25px) scale(1.05);
            border-color: #4ec5f7;
            box-shadow: 0 0 35px rgba(78, 197, 247, 0.7), 0 10px 40px rgba(78, 197, 247, 0.4), inset 0 2px 15px rgba(255, 255, 255, 0.2);
        }

        .tube.completed {
            border-color: #5dd66a;
            box-shadow: 0 0 25px rgba(93, 214, 106, 0.5), 0 8px 32px rgba(0, 0, 0, 0.3);
            animation: completedPulse 2s ease-in-out infinite;
        }

        @keyframes completedPulse {
            0%, 100% { box-shadow: 0 0 25px rgba(93, 214, 106, 0.5), 0 8px 32px rgba(0, 0, 0, 0.3); }
            50% { box-shadow: 0 0 35px rgba(93, 214, 106, 0.7), 0 8px 32px rgba(0, 0, 0, 0.3); }
        }

        .liquid {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            transition: all 0.5s cubic-bezier(0.68, 0, 0.26, 1);
            border-radius: 0 0 20px 20px;
        }

        .liquid::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 10px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: surfaceWave 3s ease-in-out infinite;
        }

        @keyframes surfaceWave {
            0%, 100% { transform: scaleX(1); opacity: 0.3; }
            50% { transform: scaleX(1.05); opacity: 0.4; }
        }

        .liquid-surface {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            border-radius: 50%;
            opacity: 0.6;
        }

        .pour-particle {
            position: fixed;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1000;
        }

        .win-particle {
            position: fixed;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1000;
        }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 12px 25px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #fff;
            transform: scale(1.05);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-hint {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.2);
        }

        .btn-hint:hover {
            background: rgba(255, 215, 0, 0.3);
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }

        .btn-hint:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(10, 10, 26, 0.95);
            padding: 40px 60px;
            border-radius: 20px;
            border: 2px solid rgba(0, 255, 255, 0.5);
            text-align: center;
            z-index: 1000;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .message.show {
            transform: translate(-50%, -50%) scale(1);
        }

        .message h2 {
            font-size: 2rem;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #00ff00, #00ffff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .level-indicator {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 10px;
        }

        @media (max-width: 600px) {
            .game-container {
                gap: 20px;
            }
            
            .controls {
                gap: 10px;
            }
            
            .btn {
                padding: 10px 20px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <h1>✨ Liquid Sort ✨</h1>
    
    <div class="game-container">
        <div class="level-indicator" id="levelIndicator">Level 1</div>
        
        <div class="tubes-container" id="tubesContainer"></div>
        
        <div class="controls">
            <button class="btn btn-hint" id="hintBtn" onclick="useHint()">💡 Подсказка (<span id="hintsLeft">3</span>)</button>
            <button class="btn" onclick="resetLevel()">🔄 Заново</button>
            <button class="btn" onclick="nextLevel()" id="nextBtn" style="display: none;">➡️ Далее</button>
        </div>
    </div>

    <div class="overlay" id="overlay" onclick="closeMessage()"></div>
    <div class="message" id="message">
        <h2 id="messageTitle">Победа!</h2>
        <p id="messageText">Уровень пройден!</p>
        <br>
        <button class="btn" onclick="nextLevel()">Продолжить</button>
    </div>

    <script>
        const COLORS = [
            { name: 'pink', value: '#ff6b9d', glow: 'rgba(255, 107, 157, 0.4)' },
            { name: 'blue', value: '#4ec5f7', glow: 'rgba(78, 197, 247, 0.4)' },
            { name: 'green', value: '#5dd66a', glow: 'rgba(93, 214, 106, 0.4)' },
            { name: 'purple', value: '#c77dff', glow: 'rgba(199, 125, 255, 0.4)' },
            { name: 'orange', value: '#ffa06b', glow: 'rgba(255, 160, 107, 0.4)' },
            { name: 'yellow', value: '#ffe66d', glow: 'rgba(255, 230, 109, 0.4)' }
        ];

        const LEVELS = [
            { tubes: 4, colors: 2, difficulty: 1 },
            { tubes: 5, colors: 3, difficulty: 1.5 },
            { tubes: 6, colors: 3, difficulty: 2 },
            { tubes: 7, colors: 4, difficulty: 2.5 },
            { tubes: 8, colors: 4, difficulty: 3 },
            { tubes: 9, colors: 5, difficulty: 3.5 },
            { tubes: 10, colors: 5, difficulty: 4 }
        ];

        let currentLevel = 0;
        let hints = 3;
        let selectedTube = null;
        let tubes = [];
        let isAnimating = false;
        let particles = [];

        function init() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            }
            loadLevel(currentLevel);
            animateParticles();
        }

        function generateLevel(levelIndex) {
            const config = LEVELS[Math.min(levelIndex, LEVELS.length - 1)];
            const numTubes = config.tubes;
            const numColors = config.colors;
            const capacity = 4;
            
            const selectedColors = COLORS.slice(0, numColors);
            let liquids = [];
            
            selectedColors.forEach(color => {
                for (let i = 0; i < capacity; i++) {
                    liquids.push(color);
                }
            });
            
            liquids = shuffleArray(liquids);
            
            let newTubes = Array(numTubes).fill(null).map(() => []);
            
            let emptyTubes = 2;
            let index = 0;
            
            for (let i = 0; i < numTubes - emptyTubes; i++) {
                for (let j = 0; j < capacity; j++) {
                    if (index < liquids.length) {
                        newTubes[i].push(liquids[index++]);
                    }
                }
            }
            
            return { tubes: newTubes, capacity };
        }

        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function loadLevel(levelIndex) {
            const levelData = generateLevel(levelIndex);
            tubes = levelData.tubes.map(tube => [...tube]);
            capacity = levelData.capacity;
            selectedTube = null;
            isAnimating = false;
            
            document.getElementById('levelIndicator').textContent = `Level ${levelIndex + 1}`;
            document.getElementById('nextBtn').style.display = 'none';
            
            renderTubes();
        }

        function renderTubes() {
            const container = document.getElementById('tubesContainer');
            container.innerHTML = '';
            
            tubes.forEach((tube, index) => {
                const tubeEl = document.createElement('div');
                tubeEl.className = 'tube';
                if (selectedTube === index) tubeEl.classList.add('selected');
                if (isTubeComplete(tube)) tubeEl.classList.add('completed');
                
                tubeEl.onclick = () => handleTubeClick(index);
                
                const totalHeight = tubeEl.clientHeight || 200;
                const liquidHeight = totalHeight / capacity;
                
                let currentBottom = 0;
                let i = 0;
                while (i < tube.length) {
                    const color = tube[i];
                    let stackSize = 1;
                    
                    while (i + stackSize < tube.length && tube[i + stackSize].name === color.name) {
                        stackSize++;
                    }
                    
                    const liquidEl = document.createElement('div');
                    liquidEl.className = 'liquid';
                    liquidEl.style.height = `${stackSize * liquidHeight}px`;
                    liquidEl.style.bottom = `${currentBottom}px`;
                    liquidEl.style.backgroundColor = color.value;
                    liquidEl.style.boxShadow = `0 0 20px ${color.glow}, inset 0 0 10px ${color.glow}`;
                    
                    const surfaceEl = document.createElement('div');
                    surfaceEl.className = 'liquid-surface';
                    surfaceEl.style.backgroundColor = adjustBrightness(color.value, 20);
                    liquidEl.appendChild(surfaceEl);
                    
                    tubeEl.appendChild(liquidEl);
                    
                    currentBottom += stackSize * liquidHeight;
                    i += stackSize;
                }
                
                container.appendChild(tubeEl);
            });
        }

        function adjustBrightness(hex, percent) {
            const num = parseInt(hex.replace('#', ''), 16);
            const amt = Math.round(2.55 * percent);
            const R = Math.min(255, (num >> 16) + amt);
            const G = Math.min(255, ((num >> 8) & 0x00FF) + amt);
            const B = Math.min(255, (num & 0x0000FF) + amt);
            return `rgb(${R}, ${G}, ${B})`;
        }

        function isTubeComplete(tube) {
            if (tube.length !== capacity) return false;
            return tube.every(liquid => liquid.name === tube[0].name);
        }

        function handleTubeClick(index) {
            if (isAnimating) return;
            
            if (selectedTube === null) {
                if (tubes[index].length > 0) {
                    selectedTube = index;
                    renderTubes();
                }
            } else if (selectedTube === index) {
                selectedTube = null;
                renderTubes();
            } else {
                tryPour(selectedTube, index);
            }
        }

        function tryPour(fromIndex, toIndex) {
            const fromTube = tubes[fromIndex];
            const toTube = tubes[toIndex];
            
            if (fromTube.length === 0) {
                selectedTube = null;
                renderTubes();
                return;
            }
            
            if (toTube.length >= capacity) {
                selectedTube = null;
                renderTubes();
                return;
            }
            
            const liquidColor = fromTube[fromTube.length - 1];
            
            if (toTube.length === 0 || toTube[toTube.length - 1].name === liquidColor.name) {
                let amountToPour = 0;
                const availableSpace = capacity - toTube.length;
                
                for (let i = fromTube.length - 1; i >= 0; i--) {
                    if (fromTube[i].name !== liquidColor.name) break;
                    amountToPour++;
                }
                
                amountToPour = Math.min(amountToPour, availableSpace);
                
                if (amountToPour === 0) {
                    selectedTube = null;
                    renderTubes();
                    return;
                }
                
                isAnimating = true;
                
                createPourEffect(fromIndex, toIndex, liquidColor, amountToPour);
                
                for (let i = 0; i < amountToPour; i++) {
                    fromTube.pop();
                    toTube.push(liquidColor);
                }
                
                selectedTube = null;
                renderTubes();
                
                setTimeout(() => {
                    isAnimating = false;
                    checkWin();
                }, 500);
            } else {
                selectedTube = null;
                renderTubes();
            }
        }

        function createPourEffect(fromIndex, toIndex, color, amount) {
            const tubes = document.querySelectorAll('.tube');
            if (fromIndex >= tubes.length || toIndex >= tubes.length) return;
            
            const fromRect = tubes[fromIndex].getBoundingClientRect();
            const toRect = tubes[toIndex].getBoundingClientRect();
            
            for (let i = 0; i < amount * 3; i++) {
                setTimeout(() => {
                    const particle = document.createElement('div');
                    particle.className = 'pour-particle';
                    particle.style.backgroundColor = color.value;
                    particle.style.boxShadow = `0 0 10px ${color.glow}`;
                    particle.style.left = `${fromRect.left + fromRect.width / 2 - 5}px`;
                    particle.style.top = `${fromRect.top + 20}px`;
                    document.body.appendChild(particle);
                    
                    const deltaX = (toRect.left + toRect.width / 2) - (fromRect.left + fromRect.width / 2);
                    const deltaY = (toRect.top + toRect.height - 30) - (fromRect.top + 20);
                    
                    particle.style.transition = 'all 0.5s cubic-bezier(0.4, 0, 0.2, 1)';
                    particle.style.transform = `translate(${deltaX}px, ${deltaY}px) scale(0.5)`;
                    particle.style.opacity = '0';
                    
                    setTimeout(() => particle.remove(), 500);
                }, i * 50);
            }
        }

        function checkWin() {
            const allComplete = tubes.every(tube => 
                tube.length === 0 || isTubeComplete(tube)
            );
            
            if (allComplete && tubes.some(tube => tube.length > 0)) {
                createWinEffect();
                showMessage('Победа!', 'Уровень пройден! 🎉');
                document.getElementById('nextBtn').style.display = 'inline-block';
            }
        }

        function createWinEffect() {
            const tubes = document.querySelectorAll('.tube');
            tubes.forEach((tube, index) => {
                if (isTubeComplete(tubes[index])) {
                    const rect = tube.getBoundingClientRect();
                    for (let i = 0; i < 20; i++) {
                        setTimeout(() => {
                            const particle = document.createElement('div');
                            particle.className = 'win-particle';
                            particle.style.left = `${rect.left + Math.random() * rect.width}px`;
                            particle.style.top = `${rect.top + Math.random() * rect.height}px`;
                            particle.style.backgroundColor = `hsl(${Math.random() * 360}, 80%, 60%)`;
                            document.body.appendChild(particle);
                            
                            const angle = Math.random() * Math.PI * 2;
                            const distance = 50 + Math.random() * 100;
                            const tx = Math.cos(angle) * distance;
                            const ty = Math.sin(angle) * distance;
                            
                            particle.style.transition = 'all 0.8s ease-out';
                            particle.style.transform = `translate(${tx}px, ${ty}px) rotate(${Math.random() * 360}deg)`;
                            particle.style.opacity = '0';
                            
                            setTimeout(() => particle.remove(), 800);
                        }, i * 30);
                    }
                }
            });
        }

        function useHint() {
            if (hints <= 0 || isAnimating) return;
            
            const hint = findHint();
            if (hint) {
                hints--;
                document.getElementById('hintsLeft').textContent = hints;
                
                isAnimating = true;
                
                const fromTube = tubes[hint.from];
                const toTube = tubes[hint.to];
                const liquidColor = fromTube[fromTube.length - 1];
                
                let amountToPour = 0;
                const availableSpace = capacity - toTube.length;
                
                for (let i = fromTube.length - 1; i >= 0; i--) {
                    if (fromTube[i].name !== liquidColor.name) break;
                    amountToPour++;
                }
                
                amountToPour = Math.min(amountToPour, availableSpace);
                
                createPourEffect(hint.from, hint.to, liquidColor, amountToPour);
                
                for (let i = 0; i < amountToPour; i++) {
                    fromTube.pop();
                    toTube.push(liquidColor);
                }
                
                renderTubes();
                
                setTimeout(() => {
                    isAnimating = false;
                    checkWin();
                }, 500);
            } else {
                showMessage('Нет подсказок', 'Попробуйте другой ход!');
            }
            
            if (hints === 0) {
                document.getElementById('hintBtn').disabled = true;
            }
        }

        function findHint() {
            for (let from = 0; from < tubes.length; from++) {
                if (tubes[from].length === 0) continue;
                
                const liquid = tubes[from][tubes[from].length - 1];
                
                for (let to = 0; to < tubes.length; to++) {
                    if (from === to) continue;
                    if (tubes[to].length >= capacity) continue;
                    
                    if (tubes[to].length === 0 || tubes[to][tubes[to].length - 1].name === liquid.name) {
                        return { from, to, colorName: liquid.name };
                    }
                }
            }
            return null;
        }

        function resetLevel() {
            loadLevel(currentLevel);
        }

        function nextLevel() {
            currentLevel++;
            if (currentLevel >= LEVELS.length) {
                currentLevel = 0;
                hints = 3;
                document.getElementById('hintsLeft').textContent = hints;
                document.getElementById('hintBtn').disabled = false;
            }
            loadLevel(currentLevel);
            closeMessage();
        }

        function showMessage(title, text) {
            document.getElementById('messageTitle').textContent = title;
            document.getElementById('messageText').textContent = text;
            document.getElementById('message').classList.add('show');
            document.getElementById('overlay').classList.add('show');
        }

        function closeMessage() {
            document.getElementById('message').classList.remove('show');
            document.getElementById('overlay').classList.remove('show');
        }

        function animateParticles() {
            const bgParticles = document.querySelectorAll('.bg-particle');
            bgParticles.forEach(p => {
                const duration = 20 + Math.random() * 30;
                p.style.animationDuration = `${duration}s`;
            });
            requestAnimationFrame(animateParticles);
        }

        window.addEventListener('resize', renderTubes);
        window.addEventListener('load', init);
    </script>
</body>
</html>
