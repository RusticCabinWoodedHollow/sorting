<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Liquid Sort Puzzle</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%230a0a1a' width='100' height='100'/><circle cx='50' cy='50' r='40' fill='%23ff0080'/></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%230a0a1a' width='100' height='100'/><circle cx='50' cy='50' r='40' fill='%23ff0080'/></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 50%, #0a0a1a 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #fff;
        }

        h1 {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 0, 128, 0.5),
                         0 0 40px rgba(0, 255, 255, 0.3);
            background: linear-gradient(90deg, #ff0080, #00ffff, #ff0080);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: glow 3s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            padding: 20px;
            max-width: 100%;
        }

        .tubes-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: clamp(15px, 3vw, 30px);
            padding: 20px;
        }

        .tube {
            width: clamp(50px, 12vw, 80px);
            height: clamp(150px, 35vw, 250px);
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: none;
            border-radius: 0 0 25px 25px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(5px);
            overflow: hidden;
        }

        .tube:hover {
            border-color: rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }

        .tube.selected {
            transform: translateY(-20px);
            border-color: #00ffff;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.6),
                        0 0 60px rgba(0, 255, 255, 0.3);
        }

        .tube.completed {
            border-color: #00ff00;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.4);
        }

        .liquid {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 0 0 20px 20px;
        }

        .liquid::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 10px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
        }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 12px 25px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #fff;
            transform: scale(1.05);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-hint {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.2);
        }

        .btn-hint:hover {
            background: rgba(255, 215, 0, 0.3);
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }

        .btn-hint:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(10, 10, 26, 0.95);
            padding: 40px 60px;
            border-radius: 20px;
            border: 2px solid rgba(0, 255, 255, 0.5);
            text-align: center;
            z-index: 1000;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .message.show {
            transform: translate(-50%, -50%) scale(1);
        }

        .message h2 {
            font-size: 2rem;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #00ff00, #00ffff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .level-indicator {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 10px;
        }

        @media (max-width: 600px) {
            .game-container {
                gap: 20px;
            }
            
            .controls {
                gap: 10px;
            }
            
            .btn {
                padding: 10px 20px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <h1>✨ Liquid Sort ✨</h1>
    
    <div class="game-container">
        <div class="level-indicator" id="levelIndicator">Level 1</div>
        
        <div class="tubes-container" id="tubesContainer"></div>
        
        <div class="controls">
            <button class="btn btn-hint" id="hintBtn" onclick="useHint()">💡 Подсказка (<span id="hintsLeft">3</span>)</button>
            <button class="btn" onclick="resetLevel()">🔄 Заново</button>
            <button class="btn" onclick="nextLevel()" id="nextBtn" style="display: none;">➡️ Далее</button>
        </div>
    </div>

    <div class="overlay" id="overlay" onclick="closeMessage()"></div>
    <div class="message" id="message">
        <h2 id="messageTitle">Победа!</h2>
        <p id="messageText">Уровень пройден!</p>
        <br>
        <button class="btn" onclick="nextLevel()">Продолжить</button>
    </div>

    <script>
        const COLORS = [
            { name: 'neon-pink', value: '#ff0080', glow: 'rgba(255, 0, 128, 0.6)' },
            { name: 'neon-blue', value: '#00ffff', glow: 'rgba(0, 255, 255, 0.6)' },
            { name: 'neon-green', value: '#00ff00', glow: 'rgba(0, 255, 0, 0.6)' },
            { name: 'neon-purple', value: '#bf00ff', glow: 'rgba(191, 0, 255, 0.6)' },
            { name: 'neon-orange', value: '#ff8000', glow: 'rgba(255, 128, 0, 0.6)' },
            { name: 'neon-yellow', value: '#ffff00', glow: 'rgba(255, 255, 0, 0.6)' }
        ];

        const LEVELS = [
            { tubes: 4, colors: 2, difficulty: 1 },
            { tubes: 5, colors: 3, difficulty: 1.5 },
            { tubes: 6, colors: 3, difficulty: 2 },
            { tubes: 7, colors: 4, difficulty: 2.5 },
            { tubes: 8, colors: 4, difficulty: 3 },
            { tubes: 9, colors: 5, difficulty: 3.5 },
            { tubes: 10, colors: 5, difficulty: 4 }
        ];

        let currentLevel = 0;
        let hints = 3;
        let selectedTube = null;
        let tubes = [];
        let isAnimating = false;

        function init() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            }
            loadLevel(currentLevel);
        }

        function generateLevel(levelIndex) {
            const config = LEVELS[Math.min(levelIndex, LEVELS.length - 1)];
            const numTubes = config.tubes;
            const numColors = config.colors;
            const capacity = 4;
            
            const selectedColors = COLORS.slice(0, numColors);
            let liquids = [];
            
            selectedColors.forEach(color => {
                for (let i = 0; i < capacity; i++) {
                    liquids.push(color);
                }
            });
            
            liquids = shuffleArray(liquids);
            
            let newTubes = Array(numTubes).fill(null).map(() => []);
            
            let emptyTubes = 2;
            let index = 0;
            
            for (let i = 0; i < numTubes - emptyTubes; i++) {
                for (let j = 0; j < capacity; j++) {
                    if (index < liquids.length) {
                        newTubes[i].push(liquids[index++]);
                    }
                }
            }
            
            return { tubes: newTubes, capacity };
        }

        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function loadLevel(levelIndex) {
            const levelData = generateLevel(levelIndex);
            tubes = levelData.tubes.map(tube => [...tube]);
            capacity = levelData.capacity;
            selectedTube = null;
            isAnimating = false;
            
            document.getElementById('levelIndicator').textContent = `Level ${levelIndex + 1}`;
            document.getElementById('nextBtn').style.display = 'none';
            
            renderTubes();
        }

        function renderTubes() {
            const container = document.getElementById('tubesContainer');
            container.innerHTML = '';
            
            tubes.forEach((tube, index) => {
                const tubeEl = document.createElement('div');
                tubeEl.className = 'tube';
                if (selectedTube === index) tubeEl.classList.add('selected');
                if (isTubeComplete(tube)) tubeEl.classList.add('completed');
                
                tubeEl.onclick = () => handleTubeClick(index);
                
                const totalHeight = tubeEl.clientHeight || 200;
                const liquidHeight = totalHeight / capacity;
                
                tube.forEach((color, liquidIndex) => {
                    const liquidEl = document.createElement('div');
                    liquidEl.className = 'liquid';
                    liquidEl.style.height = `${liquidHeight}px`;
                    liquidEl.style.bottom = `${liquidIndex * liquidHeight}px`;
                    liquidEl.style.backgroundColor = color.value;
                    liquidEl.style.boxShadow = `0 0 15px ${color.glow}`;
                    tubeEl.appendChild(liquidEl);
                });
                
                container.appendChild(tubeEl);
            });
        }

        function isTubeComplete(tube) {
            if (tube.length !== capacity) return false;
            return tube.every(liquid => liquid.name === tube[0].name);
        }

        function handleTubeClick(index) {
            if (isAnimating) return;
            
            if (selectedTube === null) {
                if (tubes[index].length > 0) {
                    selectedTube = index;
                    renderTubes();
                }
            } else if (selectedTube === index) {
                selectedTube = null;
                renderTubes();
            } else {
                tryPour(selectedTube, index);
            }
        }

        function tryPour(fromIndex, toIndex) {
            const fromTube = tubes[fromIndex];
            const toTube = tubes[toIndex];
            
            if (toTube.length >= capacity) {
                selectedTube = null;
                renderTubes();
                return;
            }
            
            const liquidToPour = fromTube[fromTube.length - 1];
            
            if (toTube.length === 0 || toTube[toTube.length - 1].name === liquidToPour.name) {
                isAnimating = true;
                
                fromTube.pop();
                toTube.push(liquidToPour);
                
                selectedTube = null;
                renderTubes();
                
                setTimeout(() => {
                    isAnimating = false;
                    checkWin();
                }, 400);
            } else {
                selectedTube = null;
                renderTubes();
            }
        }

        function checkWin() {
            const allComplete = tubes.every(tube => 
                tube.length === 0 || isTubeComplete(tube)
            );
            
            if (allComplete && tubes.some(tube => tube.length > 0)) {
                showMessage('Победа!', 'Уровень пройден! 🎉');
                document.getElementById('nextBtn').style.display = 'inline-block';
            }
        }

        function useHint() {
            if (hints <= 0 || isAnimating) return;
            
            const hint = findHint();
            if (hint) {
                hints--;
                document.getElementById('hintsLeft').textContent = hints;
                
                isAnimating = true;
                tubes[hint.from].pop();
                tubes[hint.to].push(COLORS.find(c => c.name === hint.colorName));
                
                renderTubes();
                
                setTimeout(() => {
                    isAnimating = false;
                    checkWin();
                }, 400);
            } else {
                showMessage('Нет подсказок', 'Попробуйте другой ход!');
            }
            
            if (hints === 0) {
                document.getElementById('hintBtn').disabled = true;
            }
        }

        function findHint() {
            for (let from = 0; from < tubes.length; from++) {
                if (tubes[from].length === 0) continue;
                
                const liquid = tubes[from][tubes[from].length - 1];
                
                for (let to = 0; to < tubes.length; to++) {
                    if (from === to) continue;
                    if (tubes[to].length >= capacity) continue;
                    
                    if (tubes[to].length === 0 || tubes[to][tubes[to].length - 1].name === liquid.name) {
                        const targetTube = tubes[to];
                        let canPourMore = true;
                        
                        for (let i = tubes[from].length - 2; i >= 0 && canPourMore; i--) {
                            if (tubes[from][i].name === liquid.name && targetTube.length < capacity) {
                                targetTube.push(liquid);
                            } else {
                                canPourMore = false;
                            }
                        }
                        
                        while (targetTube.length > tubes[to].length) {
                            targetTube.pop();
                        }
                        
                        return { from, to, colorName: liquid.name };
                    }
                }
            }
            return null;
        }

        function resetLevel() {
            loadLevel(currentLevel);
        }

        function nextLevel() {
            currentLevel++;
            if (currentLevel >= LEVELS.length) {
                currentLevel = 0;
                hints = 3;
                document.getElementById('hintsLeft').textContent = hints;
                document.getElementById('hintBtn').disabled = false;
            }
            loadLevel(currentLevel);
            closeMessage();
        }

        function showMessage(title, text) {
            document.getElementById('messageTitle').textContent = title;
            document.getElementById('messageText').textContent = text;
            document.getElementById('message').classList.add('show');
            document.getElementById('overlay').classList.add('show');
        }

        function closeMessage() {
            document.getElementById('message').classList.remove('show');
            document.getElementById('overlay').classList.remove('show');
        }

        window.addEventListener('resize', renderTubes);
        window.addEventListener('load', init);
    </script>
</body>
</html>
