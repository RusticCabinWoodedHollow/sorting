<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Liquid Sort Puzzle</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%230a0a1a' width='100' height='100'/><circle cx='50' cy='50' r='40' fill='%23ff0080'/></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%230a0a1a' width='100' height='100'/><circle cx='50' cy='50' r='40' fill='%23ff0080'/></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-x: hidden;
            overflow-y: auto;
            color: #fff;
            padding: 20px 0;
        }

        h1 {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 0 0 30px rgba(100, 181, 246, 0.4);
            background: linear-gradient(90deg, #64b5f6, #81c784, #64b5f6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: glow 4s ease-in-out infinite;
            letter-spacing: 2px;
        }

        @keyframes glow {
            0%, 100% { filter: brightness(1); transform: scale(1); }
            50% { filter: brightness(1.15); transform: scale(1.02); }
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            padding: 20px;
            width: 100%;
            max-width: 100%;
        }

        .tubes-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: clamp(15px, 3vw, 30px);
            padding: 15px;
            width: 100%;
            max-width: 100%;
        }

        .tube {
            width: clamp(45px, 10vw, 75px);
            height: clamp(140px, 30vw, 220px);
            border: 3px solid rgba(255, 255, 255, 0.25);
            border-top: none;
            border-radius: 0 0 25px 25px;
            position: relative;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.02) 100%);
            backdrop-filter: blur(8px);
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4), inset 0 2px 15px rgba(255, 255, 255, 0.08);
            touch-action: manipulation;
            -webkit-touch-callout: none;
            user-select: none;
        }

        .tube::before {
            content: '';
            position: absolute;
            top: 0;
            left: 10%;
            right: 10%;
            height: 60%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
            border-radius: 50%;
            pointer-events: none;
        }

        .tube:hover {
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 30px rgba(100, 181, 246, 0.35), 0 12px 45px rgba(0, 0, 0, 0.5), inset 0 2px 15px rgba(255, 255, 255, 0.12);
            transform: translateY(-4px);
        }

        .tube.selected {
            transform: translateY(-15px) scale(1.03);
            border-color: #64b5f6;
            box-shadow: 0 0 40px rgba(100, 181, 246, 0.6), 0 15px 50px rgba(100, 181, 246, 0.3), inset 0 2px 20px rgba(255, 255, 255, 0.15);
            animation: selectedPulse 1.5s ease-in-out infinite;
        }

        @keyframes selectedPulse {
            0%, 100% { 
                transform: translateY(-15px) scale(1.03);
                box-shadow: 0 0 40px rgba(100, 181, 246, 0.6), 0 15px 50px rgba(100, 181, 246, 0.3), inset 0 2px 20px rgba(255, 255, 255, 0.15); 
            }
            50% { 
                transform: translateY(-18px) scale(1.04);
                box-shadow: 0 0 55px rgba(100, 181, 246, 0.75), 0 18px 55px rgba(100, 181, 246, 0.4), inset 0 2px 25px rgba(255, 255, 255, 0.2); 
            }
        }

        .tube.completed {
            border-color: #81c784;
            box-shadow: 0 0 30px rgba(129, 199, 132, 0.45), 0 10px 40px rgba(0, 0, 0, 0.4);
            animation: completedPulse 2.5s ease-in-out infinite;
        }

        @keyframes completedPulse {
            0%, 100% { box-shadow: 0 0 30px rgba(129, 199, 132, 0.45), 0 10px 40px rgba(0, 0, 0, 0.4); }
            50% { box-shadow: 0 0 45px rgba(129, 199, 132, 0.6), 0 10px 40px rgba(0, 0, 0, 0.4); }
        }

        .liquid {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 0 0 20px 20px;
            will-change: height, bottom;
        }

        .liquid::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            animation: surfaceWave 3.5s ease-in-out infinite;
        }

        @keyframes surfaceWave {
            0%, 100% { transform: scaleX(1); opacity: 0.25; }
            50% { transform: scaleX(1.07); opacity: 0.35; }
        }

        .liquid-surface {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            border-radius: 50%;
            opacity: 0.5;
        }

        .pour-particle {
            position: fixed;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1000;
        }

        .win-particle {
            position: fixed;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1000;
        }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 14px 30px;
            border: 2px solid rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(8px);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 500;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .btn:active {
            transform: translateY(0) scale(0.97);
        }

        .message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(26, 26, 46, 0.97);
            padding: 45px 65px;
            border-radius: 25px;
            border: 2px solid rgba(100, 181, 246, 0.4);
            text-align: center;
            z-index: 1000;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(15px);
            opacity: 0;
        }

        .message.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        .message h2 {
            font-size: 2.2rem;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #81c784, #64b5f6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: titleGlow 2s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.2); }
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        @media (max-width: 600px) {
            .game-container {
                gap: 20px;
                padding: 15px;
            }
            
            .tubes-container {
                gap: clamp(10px, 2vw, 20px);
                padding: 10px;
            }
            
            .controls {
                gap: 12px;
            }
            
            .btn {
                padding: 12px 24px;
                font-size: 0.9rem;
            }
            
            h1 {
                margin-bottom: 15px;
            }
        }
    </style>
</head>
<body>
    <h1>✨ Liquid Sort ✨</h1>
    
    <div class="game-container">
        <div class="tubes-container" id="tubesContainer"></div>
        
        <div class="controls">
            <button class="btn" onclick="resetLevel()">🔄 Заново</button>
        </div>
    </div>

    <div class="overlay" id="overlay" onclick="closeMessage()"></div>
    <div class="message" id="message">
        <h2 id="messageTitle">Победа!</h2>
        <p id="messageText">Уровень пройден! 🎉</p>
        <br>
        <button class="btn" onclick="resetLevel()">Играть снова</button>
    </div>

    <script>
        const COLORS = [
            { name: 'pink', value: '#ff6b9d', glow: 'rgba(255, 107, 157, 0.4)' },
            { name: 'blue', value: '#4ec5f7', glow: 'rgba(78, 197, 247, 0.4)' },
            { name: 'green', value: '#5dd66a', glow: 'rgba(93, 214, 106, 0.4)' },
            { name: 'purple', value: '#c77dff', glow: 'rgba(199, 125, 255, 0.4)' },
            { name: 'orange', value: '#ffa06b', glow: 'rgba(255, 160, 107, 0.4)' },
            { name: 'yellow', value: '#ffe66d', glow: 'rgba(255, 230, 109, 0.4)' }
        ];

        // Средний уровень сложности: 6 пробирок, 4 цвета
        const NUM_TUBES = 6;
        const NUM_COLORS = 4;
        const CAPACITY = 4;

        let selectedTube = null;
        let tubes = [];
        let isAnimating = false;
        let particles = [];

        function init() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            }
            loadLevel();
            animateParticles();
        }

        function generateLevel() {
            const numTubes = NUM_TUBES;
            const numColors = NUM_COLORS;
            const capacity = CAPACITY;
            
            const selectedColors = COLORS.slice(0, numColors);
            let liquids = [];
            
            selectedColors.forEach(color => {
                for (let i = 0; i < capacity; i++) {
                    liquids.push(color);
                }
            });
            
            // Перемешиваем и генерируем решаемую комбинацию
            let newTubes;
            let attempts = 0;
            do {
                liquids = shuffleArray([...liquids]);
                newTubes = Array(numTubes).fill(null).map(() => []);
                
                // Заполняем все пробирки кроме двух пустых
                let index = 0;
                for (let i = 0; i < numTubes - 2; i++) {
                    for (let j = 0; j < capacity; j++) {
                        if (index < liquids.length) {
                            newTubes[i].push(liquids[index++]);
                        }
                    }
                }
                attempts++;
            } while (!isSolvable(newTubes, capacity) && attempts < 100);
            
            return { tubes: newTubes, capacity };
        }

        function isSolvable(tubesState, capacity) {
            // Простая проверка: есть ли хотя бы один возможный ход
            for (let from = 0; from < tubesState.length; from++) {
                if (tubesState[from].length === 0) continue;
                const liquid = tubesState[from][tubesState[from].length - 1];
                for (let to = 0; to < tubesState.length; to++) {
                    if (from === to) continue;
                    if (tubesState[to].length >= capacity) continue;
                    if (tubesState[to].length === 0 || tubesState[to][tubesState[to].length - 1].name === liquid.name) {
                        return true;
                    }
                }
            }
            return false;
        }

        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function loadLevel() {
            const levelData = generateLevel();
            tubes = levelData.tubes.map(tube => [...tube]);
            capacity = levelData.capacity;
            selectedTube = null;
            isAnimating = false;
            
            renderTubes();
        }

        function renderTubes() {
            const container = document.getElementById('tubesContainer');
            container.innerHTML = '';
            
            tubes.forEach((tube, index) => {
                const tubeEl = document.createElement('div');
                tubeEl.className = 'tube';
                tubeEl.dataset.index = index;
                if (selectedTube === index) tubeEl.classList.add('selected');
                if (isTubeComplete(tube)) tubeEl.classList.add('completed');
                
                // Use touchstart for mobile, click for desktop
                tubeEl.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    handleTubeClick(index);
                }, { passive: false });
                
                const totalHeight = tubeEl.clientHeight || 200;
                const liquidHeight = totalHeight / capacity;
                
                let currentBottom = 0;
                let i = 0;
                while (i < tube.length) {
                    const color = tube[i];
                    let stackSize = 1;
                    
                    while (i + stackSize < tube.length && tube[i + stackSize].name === color.name) {
                        stackSize++;
                    }
                    
                    const liquidEl = document.createElement('div');
                    liquidEl.className = 'liquid';
                    liquidEl.style.height = `${stackSize * liquidHeight}px`;
                    liquidEl.style.bottom = `${currentBottom}px`;
                    liquidEl.style.backgroundColor = color.value;
                    liquidEl.style.boxShadow = `0 0 20px ${color.glow}, inset 0 0 10px ${color.glow}`;
                    
                    const surfaceEl = document.createElement('div');
                    surfaceEl.className = 'liquid-surface';
                    surfaceEl.style.backgroundColor = adjustBrightness(color.value, 20);
                    liquidEl.appendChild(surfaceEl);
                    
                    tubeEl.appendChild(liquidEl);
                    
                    currentBottom += stackSize * liquidHeight;
                    i += stackSize;
                }
                
                container.appendChild(tubeEl);
            });
        }

        function adjustBrightness(hex, percent) {
            const num = parseInt(hex.replace('#', ''), 16);
            const amt = Math.round(2.55 * percent);
            const R = Math.min(255, (num >> 16) + amt);
            const G = Math.min(255, ((num >> 8) & 0x00FF) + amt);
            const B = Math.min(255, (num & 0x0000FF) + amt);
            return `rgb(${R}, ${G}, ${B})`;
        }

        function isTubeComplete(tube) {
            if (tube.length !== capacity) return false;
            return tube.every(liquid => liquid.name === tube[0].name);
        }

        function handleTubeClick(index) {
            if (isAnimating) return;
            
            if (selectedTube === null) {
                if (tubes[index].length > 0) {
                    selectedTube = index;
                    renderTubes();
                }
            } else if (selectedTube === index) {
                selectedTube = null;
                renderTubes();
            } else {
                tryPour(selectedTube, index);
            }
        }

        // Prevent default touch behavior
        document.addEventListener('touchstart', function(e) {
            if (e.target.classList.contains('tube')) {
                e.preventDefault();
            }
        }, { passive: false });

        function tryPour(fromIndex, toIndex) {
            const fromTube = tubes[fromIndex];
            const toTube = tubes[toIndex];
            
            if (fromTube.length === 0) {
                selectedTube = null;
                renderTubes();
                return;
            }
            
            if (toTube.length >= capacity) {
                selectedTube = null;
                renderTubes();
                return;
            }
            
            const liquidColor = fromTube[fromTube.length - 1];
            
            if (toTube.length === 0 || toTube[toTube.length - 1].name === liquidColor.name) {
                let amountToPour = 0;
                const availableSpace = capacity - toTube.length;
                
                for (let i = fromTube.length - 1; i >= 0; i--) {
                    if (fromTube[i].name !== liquidColor.name) break;
                    amountToPour++;
                }
                
                amountToPour = Math.min(amountToPour, availableSpace);
                
                if (amountToPour === 0) {
                    selectedTube = null;
                    renderTubes();
                    return;
                }
                
                isAnimating = true;
                
                createPourEffect(fromIndex, toIndex, liquidColor, amountToPour);
                
                // Animate the pour with staggered delays for each unit
                let pouredCount = 0;
                const pourInterval = setInterval(() => {
                    if (pouredCount < amountToPour) {
                        fromTube.pop();
                        toTube.push(liquidColor);
                        pouredCount++;
                        renderTubes();
                    } else {
                        clearInterval(pourInterval);
                        selectedTube = null;
                        
                        setTimeout(() => {
                            isAnimating = false;
                            checkWin();
                        }, 300);
                    }
                }, 150);
            } else {
                selectedTube = null;
                renderTubes();
            }
        }

        function createPourEffect(fromIndex, toIndex, color, amount) {
            const tubeElements = document.querySelectorAll('.tube');
            if (fromIndex >= tubeElements.length || toIndex >= tubeElements.length) return;
            
            const fromRect = tubeElements[fromIndex].getBoundingClientRect();
            const toRect = tubeElements[toIndex].getBoundingClientRect();
            
            for (let i = 0; i < amount * 4; i++) {
                setTimeout(() => {
                    const particle = document.createElement('div');
                    particle.className = 'pour-particle';
                    particle.style.backgroundColor = color.value;
                    particle.style.boxShadow = `0 0 10px ${color.glow}`;
                    particle.style.left = `${fromRect.left + fromRect.width / 2 - 6}px`;
                    particle.style.top = `${fromRect.top + 20}px`;
                    document.body.appendChild(particle);
                    
                    const deltaX = (toRect.left + toRect.width / 2) - (fromRect.left + fromRect.width / 2);
                    const deltaY = (toRect.top + toRect.height - 30) - (fromRect.top + 20);
                    
                    // Add arc to the particle motion
                    const arcHeight = 30 + Math.random() * 20;
                    particle.style.transition = 'all 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
                    
                    // Animate with arc
                    const startTime = Date.now();
                    const duration = 600;
                    
                    const animateParticle = () => {
                        const elapsed = Date.now() - startTime;
                        const progress = Math.min(elapsed / duration, 1);
                        
                        const currentX = deltaX * progress;
                        const currentY = deltaY * progress - Math.sin(progress * Math.PI) * arcHeight;
                        const scale = 1 - progress * 0.5;
                        const opacity = 1 - progress;
                        
                        particle.style.transform = `translate(${currentX}px, ${currentY}px) scale(${scale})`;
                        particle.style.opacity = opacity;
                        
                        if (progress < 1) {
                            requestAnimationFrame(animateParticle);
                        } else {
                            particle.remove();
                        }
                    };
                    
                    requestAnimationFrame(animateParticle);
                }, i * 40);
            }
        }

        function checkWin() {
            const allComplete = tubes.every(tube => 
                tube.length === 0 || isTubeComplete(tube)
            );
            
            if (allComplete && tubes.some(tube => tube.length > 0)) {
                createWinEffect();
                showMessage('Победа!', 'Уровень пройден! 🎉');
            }
        }

        function createWinEffect() {
            const tubeElements = document.querySelectorAll('.tube');
            tubeElements.forEach((tube, index) => {
                if (isTubeComplete(tubes[index])) {
                    const rect = tube.getBoundingClientRect();
                    for (let i = 0; i < 30; i++) {
                        setTimeout(() => {
                            const particle = document.createElement('div');
                            particle.className = 'win-particle';
                            particle.style.left = `${rect.left + Math.random() * rect.width}px`;
                            particle.style.top = `${rect.top + Math.random() * rect.height}px`;
                            particle.style.backgroundColor = `hsl(${Math.random() * 360}, 80%, 60%)`;
                            particle.style.boxShadow = `0 0 15px hsla(${Math.random() * 360}, 80%, 60%, 0.6)`;
                            document.body.appendChild(particle);
                            
                            const angle = Math.random() * Math.PI * 2;
                            const distance = 50 + Math.random() * 100;
                            const tx = Math.cos(angle) * distance;
                            const ty = Math.sin(angle) * distance;
                            
                            // Animate with gravity effect
                            const startTime = Date.now();
                            const duration = 800;
                            
                            const animateParticle = () => {
                                const elapsed = Date.now() - startTime;
                                const progress = Math.min(elapsed / duration, 1);
                                
                                const currentTx = tx * progress;
                                const currentTy = ty * progress + Math.pow(progress, 2) * 50; // gravity
                                const rotation = progress * Math.random() * 360;
                                const scale = 1 - progress * 0.3;
                                const opacity = 1 - progress;
                                
                                particle.style.transform = `translate(${currentTx}px, ${currentTy}px) rotate(${rotation}deg) scale(${scale})`;
                                particle.style.opacity = opacity;
                                
                                if (progress < 1) {
                                    requestAnimationFrame(animateParticle);
                                } else {
                                    particle.remove();
                                }
                            };
                            
                            requestAnimationFrame(animateParticle);
                        }, i * 25);
                    }
                }
            });
        }

        function resetLevel() {
            loadLevel();
        }

        function showMessage(title, text) {
            document.getElementById('messageTitle').textContent = title;
            document.getElementById('messageText').textContent = text;
            document.getElementById('message').classList.add('show');
            document.getElementById('overlay').classList.add('show');
        }

        function closeMessage() {
            document.getElementById('message').classList.remove('show');
            document.getElementById('overlay').classList.remove('show');
        }

        function animateParticles() {
            const bgParticles = document.querySelectorAll('.bg-particle');
            bgParticles.forEach(p => {
                const duration = 20 + Math.random() * 30;
                p.style.animationDuration = `${duration}s`;
            });
            requestAnimationFrame(animateParticles);
        }

        window.addEventListener('resize', renderTubes);
        window.addEventListener('load', init);
    </script>
</body>
</html>
